<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040714" />
    </linearGradient>

    <!-- Metallic Edge Ring -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Vertebral Platinum Gradient -->
    <linearGradient id="vertebraGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Vertebra Dark Gradient -->
    <linearGradient id="vertebraDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Disc Core Electric Cyan Glow -->
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Kinetic Vector Gold Flame Gradient -->
    <linearGradient id="goldVector" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Radial Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Squircle Container (iOS / macOS App Icon Standard) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#edgeGrad)" stroke-width="4" filter="url(#dropShadow)" />

  <!-- Subtle Forensic Coordinate Matrix Grid (15% opacity) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="80" y1="140" x2="432" y2="140" stroke-dasharray="4 6" />
    <line x1="80" y1="256" x2="432" y2="256" stroke-dasharray="4 6" />
    <line x1="80" y1="372" x2="432" y2="372" stroke-dasharray="4 6" />
    <line x1="140" y1="80" x2="140" y2="432" stroke-dasharray="4 6" />
    <line x1="256" y1="80" x2="256" y2="432" stroke-dasharray="4 6" />
    <line x1="372" y1="80" x2="372" y2="432" stroke-dasharray="4 6" />
    <!-- Center Matrix Target Rings -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="1" />
    <circle cx="256" cy="256" r="110" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 5" />
  </g>

  <!-- Glow Halo Behind Intervertebral Disc -->
  <circle cx="256" cy="256" r="48" fill="#0284c7" opacity="0.35" filter="url(#cyanGlow)" />

  <!-- ========================================== -->
  <!-- SPINAL COLUMN MOTION SEGMENT (Vertebrae)   -->
  <!-- ========================================== -->
  <g filter="url(#dropShadow)">
    <!-- UPPER VERTEBRA BODY (Superior Segment) -->
    <path d="M 172 136 
             C 172 124, 186 114, 256 114 
             C 326 114, 340 124, 340 136 
             L 348 190 
             C 348 204, 328 212, 256 212 
             C 184 212, 164 204, 164 190 
             Z" 
          fill="url(#vertebraGrad)" />
    <!-- Superior Endplate Bevel Highlight -->
    <path d="M 180 140 C 206 128, 306 128, 332 140" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6" />
    <!-- Anterior Vertebral Notch / Shadow -->
    <path d="M 166 186 C 188 198, 324 198, 346 186" fill="none" stroke="#334155" stroke-width="3" opacity="0.5" />

    <!-- INTERVERTEBRAL DISC SPACE (The Clinical Index Locus) -->
    <!-- Disc Outer Annular Fibers -->
    <rect x="180" y="234" width="152" height="44" rx="22" fill="#0f172a" stroke="url(#cyanCore)" stroke-width="3" filter="url(#cyanGlow)" />
    <!-- Disc Inner Nucleus Pulposus Light Core -->
    <ellipse cx="256" cy="256" rx="46" ry="12" fill="url(#cyanCore)" />

    <!-- LOWER VERTEBRA BODY (Inferior Segment) -->
    <path d="M 164 322 
             C 164 308, 184 300, 256 300 
             C 328 300, 348 308, 348 322 
             L 340 376 
             C 340 388, 326 398, 256 398 
             C 186 398, 172 388, 172 376 
             Z" 
          fill="url(#vertebraDark)" />
    <!-- Inferior Endplate Rim -->
    <path d="M 168 324 C 190 312, 322 312, 344 324" fill="none" stroke="#94a3b8" stroke-width="2.5" opacity="0.7" />
  </g>

  <!-- ========================================== -->
  <!-- FORENSIC FORCE VECTOR & LEGAL ARBITER      -->
  <!-- Dynamic Kinetic Ray Intersecting the Disc  -->
  <!-- ========================================== -->
  <g filter="url(#goldGlow)">
    <!-- Dynamic Kinematic Impact Vector Line (Rear/Lateral Shear Angle: 38 deg) -->
    <line x1="86" y1="384" x2="416" y2="128" stroke="url(#goldVector)" stroke-width="7" stroke-linecap="round" />
    
    <!-- Kinetic Vector Focal Point Crosshairs at Disc -->
    <circle cx="256" cy="256" r="6" fill="#fef08a" stroke="#f59e0b" stroke-width="2.5" />
    
    <!-- Vector Arrowhead (Leading Edge) -->
    <polygon points="432,116 398,124 416,142" fill="#fbbf24" stroke="#fef08a" stroke-width="1.5" />
  </g>

  <!-- Precision Measurement Ticks on Vector -->
  <g stroke="#fbbf24" stroke-width="2.5" opacity="0.8">
    <line x1="172" y1="316" x2="162" y2="328" />
    <line x1="214" y1="284" x2="204" y2="296" />
    <line x1="298" y1="218" x2="288" y2="230" />
    <line x1="340" y1="186" x2="330" y2="198" />
  </g>

  <!-- Legal Balance Scales Accent (Subtle Architectural Iconography at Top Right) -->
  <g transform="translate(376, 76) scale(0.65)" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.75">
    <line x1="40" y1="20" x2="40" y2="68" stroke-linecap="round" />
    <line x1="16" y1="32" x2="64" y2="32" stroke-linecap="round" />
    <!-- Left Pan -->
    <path d="M 16 32 L 6 56 L 26 56 Z" stroke-linejoin="round" />
    <!-- Right Pan -->
    <path d="M 64 32 L 54 56 L 74 56 Z" stroke-linejoin="round" />
  </g>
</svg>